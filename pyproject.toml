[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-arena"
version = "0.0.1"
description = "LLM 社群評價排行榜的資料管線"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# C3 評分用；本機 CPU 安裝請用 `uv pip install "llm-arena[score]" --torch-backend=cpu`
# （laya 的 torch 預設會抓 CUDA wheel；laya 已淘汰、選型理由與坑清單詳 git 歷史）。
score = [
    "laya==0.3.21",
]

[project.scripts]
arena = "arena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
