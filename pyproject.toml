[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-arena"
version = "0.0.1"
description = "LLM 社群評價排行榜的資料管線"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
arena = "arena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
