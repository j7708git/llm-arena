# 人工維護的模型清單（任務 C1）。這是「主」名單：OpenRouter 只負責附掛
# 定價與 context length，不會決定要追蹤哪些模型（見 docs/plan.md 任務 C1）。
#
# 每筆欄位：
#   id       OpenRouter 模型 id（`<author>/<model-slug>` 格式，必填）
#   name     網站顯示短名（必填，不隨 OpenRouter 的 "Provider: ..." 標題變動）
#   provider 廠牌顯示名（必填，供網站篩選）
#   alias    選用；OpenRouter 查不到 id 時的備援匹配鍵（例如舊 id／canonical slug）
#
# 清單 v2（2026-10-01，實作裁定 14）。入選依據一律以 X 池實掃證據為準，見
# `docs/research/model-roster-survey.md`（§2 名稱統計、§5 A/B 檔建議）：
#   - 移除 anthropic/claude-sonnet-4（X 0/2 命中，名下貼文都在聊 Sonnet 5.5）
#   - 移除 openai/gpt-5（X 1/7 命中，其餘在聊 GPT-5.6／6 系列）
#   - 移除 deepseek/deepseek-v3.1（過時世代，且 OpenRouter 已下架）
#   - 保留 google/gemini-2.5-pro（X 6/7 真討論——社群緬懷文，非誤歸）
#   - 新增 A 檔 5 個＋B 檔 5 個（下方註解標明檔位與 X 池筆數）
